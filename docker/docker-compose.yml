version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sentinelguard-postgres
    environment:
      POSTGRES_DB: sentinelguard
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: change-me-in-production
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sentinelguard-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentinelguard-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinelguard-network

  # SentinelGuard API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentinelguard-api
    environment:
      - APP_NAME=SentinelGuard
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sentinelguard
      - DB_USER=sentinel
      - DB_PASSWORD=change-me-in-production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOWNSTREAM_API_URL=http://backend:8001
      - SECRET_KEY=change-me-in-production
      - ADMIN_API_KEY=change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentinelguard-network

  # Celery Worker
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: sentinelguard-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - APP_NAME=SentinelGuard
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sentinelguard
      - DB_USER=sentinel
      - DB_PASSWORD=change-me-in-production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelguard-network

  # Celery Beat Scheduler
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: sentinelguard-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - APP_NAME=SentinelGuard
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sentinelguard
      - DB_USER=sentinel
      - DB_PASSWORD=change-me-in-production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelguard-network

  # Demo Backend API (for proxy testing)
  backend:
    image: python:3.11-slim
    container_name: sentinelguard-backend
    command: >
      bash -c "
        apt-get update && 
        apt-get install -y curl &&
        cd /app &&
        python -m http.server 8001
      "
    working_dir: /app
    volumes:
      - ../scripts/demo-backend:/app
    ports:
      - "8001:8001"
    networks:
      - sentinelguard-network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: sentinelguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/sentinel.conf:/etc/nginx/conf.d/sentinel.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sentinelguard-network

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: sentinelguard-flower
    command: celery -A app.workers.celery_app flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentinelguard-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sentinelguard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
